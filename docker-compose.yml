version: '3.8'

services:
  # =============================================================================
  # Database
  # =============================================================================
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: secdash_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secdash}
      POSTGRES_USER: ${POSTGRES_USER:-secdash_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secdash_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - secdash_network
    restart: unless-stopped

  # =============================================================================
  # Cache & Message Broker
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: secdash_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - secdash_network
    restart: unless-stopped

  # =============================================================================
  # Backend API
  # =============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: secdash_backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-secdash_user}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-secdash}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-secret-change-in-production}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITLAB_TOKEN=${GITLAB_TOKEN}
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock  # For container scanning
      - scan_results:/app/scan_results
      - temp_repos:/tmp/secdash_repos
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - secdash_network
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # =============================================================================
  # Celery Worker
  # =============================================================================
  celery_worker:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: secdash_celery_worker
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-secdash_user}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-secdash}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITLAB_TOKEN=${GITLAB_TOKEN}
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - scan_results:/app/scan_results
      - temp_repos:/tmp/secdash_repos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - secdash_network
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4

  # =============================================================================
  # Celery Beat (Scheduler)
  # =============================================================================
  celery_beat:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: secdash_celery_beat
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-secdash_user}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-secdash}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - secdash_network
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info

  # =============================================================================
  # Ollama (Local LLM)
  # =============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: secdash_ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - secdash_network
    restart: unless-stopped
    # Uncomment if you have GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # =============================================================================
  # Frontend
  # =============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: secdash_frontend
    environment:
      - NEXT_PUBLIC_API_URL=${BACKEND_URL:-http://localhost:8000}
      - NODE_ENV=${ENVIRONMENT:-development}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - secdash_network
    restart: unless-stopped
    command: npm run dev

  # =============================================================================
  # Nginx Reverse Proxy
  # =============================================================================
  nginx:
    image: nginx:alpine
    container_name: secdash_nginx
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    depends_on:
      - backend
      - frontend
    networks:
      - secdash_network
    restart: unless-stopped

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local
  scan_results:
    driver: local
  temp_repos:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  secdash_network:
    driver: bridge
